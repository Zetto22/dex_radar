# Pack one mod folder as a root-level zip and publish a GitHub Release.
#
# Tag format (required by gen1recomp ModUpdate):  v<semver>
#   e.g.  v1.0.0
# The engine strips a leading "v" and requires the rest to start with X.Y.Z.
# Prefixed tags like dex_radar-v1.0.0 are IGNORED by in-game "Check for updates".
#
# Zip asset:  <mod_id>-<version>.zip  (e.g. dex_radar-1.0.0.zip)
# Zip layout: files at archive root (manifest.json, main.lua, …).
#
# Manual run: Actions → Release mod → mod_id + version
# Tag push:   git tag v1.0.0 && git push origin v1.0.0
#             (defaults mod_id to dex_radar; override via workflow_dispatch)

name: Release mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mod_id:
        description: "Mod folder / manifest id (e.g. dex_radar)"
        required: true
        type: string
        default: "dex_radar"
      version:
        description: "Semver without leading v (e.g. 1.0.0). Empty = read manifest.json"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve mod id and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_MOD_ID="dex_radar"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MOD_ID="${{ inputs.mod_id }}"
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            # Engine-compatible: v1.2.3
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              VERSION="${TAG#v}"
              MOD_ID="$DEFAULT_MOD_ID"
            else
              echo "Tag must look like v<semver> (got: $TAG)"
              echo "gen1recomp ModUpdate only accepts semver tags (v1.0.0), not mod-prefixed tags."
              exit 1
            fi
          fi

          if [ -z "${MOD_ID}" ]; then
            MOD_ID="$DEFAULT_MOD_ID"
          fi

          if [ ! -d "$MOD_ID" ]; then
            echo "Missing mod folder: $MOD_ID"
            exit 1
          fi
          if [ ! -f "$MOD_ID/manifest.json" ]; then
            echo "Missing $MOD_ID/manifest.json"
            exit 1
          fi

          if [ -z "${VERSION}" ]; then
            VERSION=$(python3 -c "import json; print(json.load(open('$MOD_ID/manifest.json'))['version'])")
          fi

          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('$MOD_ID/manifest.json'))['version'])")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag/input version ($VERSION) != manifest version ($MANIFEST_VERSION)"
            exit 1
          fi

          ASSET="${MOD_ID}-${VERSION}.zip"
          TITLE=$(python3 tools/github_release_notes.py "$MOD_ID" "$VERSION" --title-only)
          python3 tools/github_release_notes.py "$MOD_ID" "$VERSION" > release_notes.md
          {
            echo "mod_id=$MOD_ID"
            echo "version=$VERSION"
            echo "asset=$ASSET"
            echo "tag=v${VERSION}"
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Packing $MOD_ID @ $VERSION -> $ASSET (release tag v$VERSION)"
          echo "Title: $TITLE"
          echo "----- notes -----"
          cat release_notes.md

      - name: Build installable zip (files at archive root)
        shell: bash
        run: |
          set -euo pipefail
          MOD_ID="${{ steps.meta.outputs.mod_id }}"
          ASSET="${{ steps.meta.outputs.asset }}"
          (
            cd "$MOD_ID"
            zip -r "../$ASSET" . \
              -x "*.zip" \
              -x "*.modpkg" \
              -x "tests/*" \
              -x ".modkitignore" \
              -x ".luarc.json" \
              -x ".git/*"
          )
          unzip -l "$ASSET" | head -40

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release_notes.md
          files: ${{ steps.meta.outputs.asset }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: true
